name: Auto Generate Tips HTML from Markdown

on:
  push:
    paths:
      - 'content/tips/**'
      - 'scripts/build-tips.mjs'
    branches:
      - main
      - feat/tips
  repository_dispatch:
    types: [tips-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tips-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile HTML from Markdown tips
        run: npm run build:tips

      - name: Commit and push generated HTML if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tips.html tips/ public/tips-search-index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "build(tips): auto-generate HTML pages from markdown tips" && git push)
