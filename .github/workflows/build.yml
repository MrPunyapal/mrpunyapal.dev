name: Build & Auto-Generate Assets

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [tips-updated]
  workflow_dispatch:

concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 1. Compile Tips HTML & Sitemap
        run: npm run build:tips

      - name: 2. Generate PDF Resume
        run: npm run build:pdf

      - name: 3. Generate OG Screenshots
        run: npm run generate:og

      - name: Commit and push all generated assets if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tips.html tips/ public/tips-search-index.json public/sitemap.xml public/resume.pdf public/og/
          if ! git diff --staged --quiet; then
            git commit -m "build: auto-generate site assets (tips, resume PDF, OG screenshots)"
            git checkout -- .
            git clean -fd
            git pull --rebase --autostash origin main
            git push origin main
          fi
