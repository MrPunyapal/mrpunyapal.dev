name: Validate pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with content submodules
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build all pages, blogs and tips
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Visual smoke test, light and dark
        run: node scripts/visual-qa.mjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: visual-qa/
          if-no-files-found: ignore
